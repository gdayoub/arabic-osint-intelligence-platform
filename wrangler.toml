# Deploys dist/ (baked dashboard) as a static-assets Cloudflare Worker.
# Matches the existing "arabic-osint-dashboard" resource, created via
# Cloudflare's "Upload your static files" flow, which creates a Worker
# with static assets rather than a classic Pages project on current
# accounts — see docs/adr/0008-actions-runtime-static-pages-dashboard.md.
name = "arabic-osint-dashboard"
compatibility_date = "2026-08-01"
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Without this, Cloudflare serves any path matching a file in dist/
# directly from the asset store, bypassing worker.js's fetch handler
# entirely -- confirmed via curl that the CORS header never appeared
# without this line, despite the handler code itself being correct.
run_worker_first = true
