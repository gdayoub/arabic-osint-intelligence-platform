name: Scheduled OSINT Pipeline (legacy, Railway)

# Superseded by .github/workflows/pipeline.yml (M1.5) -- Railway is
# decommissioned (docs/adr/0008-actions-runtime-static-pages-dashboard.md).
# Cron disabled; kept as workflow_dispatch only in case a manual rollback to
# the Railway-hosted pipeline is ever needed. Delete once pipeline.yml has
# proven itself over a few weeks of scheduled runs.
on:
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway pipeline
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.RAILWAY_PIPELINE_URL }}/api/trigger-pipeline" \
            --fail \
            --silent \
            --show-error
        timeout-minutes: 2
