name: OSINT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours at :00 UTC
  workflow_dispatch:
    inputs:
      review_margin:
        description: >-
          Distance from the scorer threshold that queues a pair for review.
          Leave as 0.15 for normal runs; widen only for a one-off manual
          bulk-labeling session (see docs/adr/0013).
        required: false
        default: "0.15"

# Prevent two overlapping runs from racing the same URL-unique inserts.
# cancel-in-progress: false -- queue the next run rather than kill one
# mid-write, which is worse than waiting.
concurrency:
  group: osint-neon-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BLOB_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The executable models and committed schema/fixture/type bundle must
      # still describe the same public payload before any database write.
      - run: python scripts/generate_dashboard_contract.py --check

      # Gate: never write to Neon from a broken tree.
      - run: python -m pytest tests/unit -q

      # Scheduled writers never create or migrate schema. They fail before
      # ingestion unless the explicit rollout workflow has placed Neon at
      # this checkout's sole Alembic head and reflection matches the ORM.
      - run: python scripts/verify_core_schema.py

      # One command owns the complete run/stage/source lifecycle.  It writes
      # only data-work evidence to the ledger; it does not create a release
      # candidate or claim the later Cloudflare deployment succeeded.
      #
      # Missing DeepL skips translation. A configured provider runs in
      # best-effort mode: a provider failure finishes the ledgered run as
      # degraded after baking the still-usable Arabic snapshot.
      - name: Run ledgered core pipeline
        env:
          REVIEW_MARGIN: ${{ inputs.review_margin || '0.15' }}
        run: |
          translation_mode=skip
          if [ -n "${DEEPL_API_KEY:-}" ]; then
            translation_mode=best-effort
          fi
          python main.py run-core-pipeline \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --translation-mode "$translation_mode" \
            --review-margin "$REVIEW_MARGIN" \
            --out dist/data.json

      - run: cp src/api/static/dashboard.html dist/index.html
      - run: cp src/api/static/country.html dist/country.html

      # Deploys as a Workers-with-static-assets site (wrangler.toml), not
      # classic Pages -- see docs/adr/0008 for why.
      - name: Deploy dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Pinned explicitly: wrangler-action's default (3.90.0) predates
          # run_worker_first in [assets], which wrangler.toml relies on.
          wranglerVersion: '4'
