name: OSINT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours at :00 UTC
  workflow_dispatch:

# Prevent two overlapping runs from racing the same URL-unique inserts.
# cancel-in-progress: false -- queue the next run rather than kill one
# mid-write, which is worse than waiting.
concurrency:
  group: osint-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BLOB_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # Gate: never write to Neon from a broken tree.
      - run: python -m pytest tests/unit -q

      # create_all() only creates missing tables, never alters existing ones
      # -- safe to run every time. Needed because there's no backfill; the
      # very first run starts from a genuinely empty Neon database.
      - run: python main.py init-core-db

      - run: python main.py ingest-core

      - run: python main.py process-core

      # Skipped cleanly when DEEPL_API_KEY isn't configured, and never fails
      # the run: a spent quota or a DeepL outage should cost English titles,
      # not the whole pipeline. The dashboard renders Arabic either way.
      - name: Translate titles (optional)
        # env, not secrets: the secrets context isn't reliably available in
        # step-level `if`, but the job env above already carries the value.
        if: env.DEEPL_API_KEY != ''
        continue-on-error: true
        run: python main.py translate-core

      - run: python main.py bake-dashboard --out dist/data.json

      - run: cp src/api/static/dashboard.html dist/index.html
      - run: cp src/api/static/country.html dist/country.html

      # Deploys as a Workers-with-static-assets site (wrangler.toml), not
      # classic Pages -- see docs/adr/0008 for why.
      - name: Deploy dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Pinned explicitly: wrangler-action's default (3.90.0) predates
          # run_worker_first in [assets], which wrangler.toml relies on.
          wranglerVersion: '4'
