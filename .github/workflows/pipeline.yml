name: OSINT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours at :00 UTC
  workflow_dispatch:

# Prevent two overlapping runs from racing the same URL-unique inserts.
# cancel-in-progress: false -- queue the next run rather than kill one
# mid-write, which is worse than waiting.
concurrency:
  group: osint-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BLOB_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # Gate: never write to Neon from a broken tree.
      - run: python -m pytest tests/unit -q

      # create_all() only creates missing tables, never alters existing ones
      # -- safe to run every time. Needed because there's no backfill; the
      # very first run starts from a genuinely empty Neon database.
      - run: python main.py init-core-db

      - run: python main.py ingest-core

      - run: python main.py process-core

      - run: python main.py bake-dashboard --out dist/data.json

      - run: cp src/api/static/dashboard.html dist/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=arabic-osint-dashboard --branch=main
