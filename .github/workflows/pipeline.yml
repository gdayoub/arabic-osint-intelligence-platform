name: OSINT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours at :00 UTC
  workflow_dispatch:
    inputs:
      review_margin:
        description: >-
          Distance from the scorer threshold that queues a pair for review.
          Leave as 0.15 for normal runs; widen only for a one-off manual
          bulk-labeling session (see docs/adr/0013).
        required: false
        default: "0.15"
      pipeline_mode:
        description: >-
          scheduled keeps the 24-article/source cap this workflow always
          uses on its cron trigger. backfill raises the default to 120 for
          one manually dispatched catch-up run — prefer backfill.yml
          instead for a real bulk backfill (see docs/adr/0032). Ignored on
          the cron trigger: a scheduled run is always pipeline_mode=scheduled
          regardless of this input's stored default.
        required: false
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - backfill
      limit_per_source:
        description: >-
          Override the per-source article cap for this one manually
          dispatched run. Leave blank to use pipeline_mode's default (24
          scheduled / 120 backfill). Ignored on the cron trigger.
        required: false
        default: ""

# Prevent two overlapping runs from racing the same URL-unique inserts.
# cancel-in-progress: false -- queue the next run rather than kill one
# mid-write, which is worse than waiting.
concurrency:
  group: osint-neon-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BLOB_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The executable models and committed schema/fixture/type bundle must
      # still describe the same public payload before any database write.
      - run: python scripts/generate_dashboard_contract.py --check

      # Gate: never write to Neon from a broken tree.
      - run: python -m pytest tests/unit -q

      # Scheduled writers never create or migrate schema. They fail before
      # ingestion unless the explicit rollout workflow has placed Neon at
      # this checkout's sole Alembic head and reflection matches the ORM.
      - run: python scripts/verify_core_schema.py

      # One command owns the complete run/stage/source lifecycle.  It writes
      # only data-work evidence to the ledger; it does not create a release
      # candidate or claim the later Cloudflare deployment succeeded.
      #
      # Missing DeepL skips translation. A configured provider runs in
      # best-effort mode: a provider failure finishes the ledgered run as
      # degraded after baking the still-usable Arabic snapshot.
      # pipeline_mode/limit_per_source are only ever read on a manual
      # workflow_dispatch (EVENT_NAME check below) -- the cron `schedule`
      # trigger has no `inputs` context at all, so a cron run always resolves
      # to scheduled/24 no matter what default is stored on this workflow's
      # dispatch form.  Values flow through env vars, not direct expression
      # interpolation into the shell script, to keep the invocation safe.
      - name: Run ledgered core pipeline
        env:
          REVIEW_MARGIN: ${{ inputs.review_margin || '0.15' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PIPELINE_MODE: ${{ inputs.pipeline_mode }}
          INPUT_LIMIT_PER_SOURCE: ${{ inputs.limit_per_source }}
        run: |
          translation_mode=skip
          if [ -n "${DEEPL_API_KEY:-}" ]; then
            translation_mode=best-effort
          fi

          pipeline_mode=scheduled
          limit_args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pipeline_mode="${INPUT_PIPELINE_MODE:-scheduled}"
            if [ -n "${INPUT_LIMIT_PER_SOURCE:-}" ]; then
              limit_args=(--limit-per-source "$INPUT_LIMIT_PER_SOURCE")
            fi
          fi

          python main.py run-core-pipeline \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --translation-mode "$translation_mode" \
            --review-margin "$REVIEW_MARGIN" \
            --pipeline-mode "$pipeline_mode" \
            "${limit_args[@]}" \
            --out dist/data.json

      - run: cp src/api/static/dashboard.html dist/index.html
      - run: cp src/api/static/country.html dist/country.html

      # Deploys as a Workers-with-static-assets site (wrangler.toml), not
      # classic Pages -- see docs/adr/0008 for why.
      - name: Deploy dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Pinned explicitly: wrangler-action's default (3.90.0) predates
          # run_worker_first in [assets], which wrangler.toml relies on.
          wranglerVersion: '4'
