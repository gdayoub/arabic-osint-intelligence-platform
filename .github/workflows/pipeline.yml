name: OSINT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours at :00 UTC
  workflow_dispatch:
    inputs:
      review_margin:
        description: >-
          Distance from the scorer threshold that queues a pair for review.
          Leave as 0.15 for normal runs; widen only for a one-off manual
          bulk-labeling session (see docs/adr/0013).
        required: false
        default: "0.15"
      pipeline_mode:
        description: >-
          This workflow only ever runs pipeline_mode=scheduled -- it ends in
          an unconditional public Cloudflare deploy, so it must never carry a
          larger, unreviewed backfill scrape to that deploy step (see
          docs/adr/0032). "backfill" is deliberately not an option here: use
          backfill.yml for a real bulk backfill, which has no deploy step to
          guard in the first place. This input exists only so the cap
          override below is explicit and so the choice type documents, in
          the dispatch form itself, why backfill is not selectable.
        required: false
        default: "scheduled"
        type: choice
        options:
          - scheduled
      limit_per_source:
        description: >-
          Override the per-source article cap for this one manually
          dispatched scheduled run. Leave blank to use the scheduled default
          of 24. Ignored on the cron trigger. This still deploys at the end
          of this workflow, so do not use it to sneak a backfill-sized scrape
          through -- use backfill.yml instead.
        required: false
        default: ""

# Prevent two overlapping runs from racing the same URL-unique inserts.
# cancel-in-progress: false -- queue the next run rather than kill one
# mid-write, which is worse than waiting.
concurrency:
  group: osint-neon-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BLOB_BACKEND: r2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The executable models and committed schema/fixture/type bundle must
      # still describe the same public payload before any database write.
      - run: python scripts/generate_dashboard_contract.py --check

      # Gate: never write to Neon from a broken tree.
      - run: python -m pytest tests/unit -q

      # Scheduled writers never create or migrate schema. They fail before
      # ingestion unless the explicit rollout workflow has placed Neon at
      # this checkout's sole Alembic head and reflection matches the ORM.
      - run: python scripts/verify_core_schema.py

      # One command owns the complete run/stage/source lifecycle.  It writes
      # only data-work evidence to the ledger; it does not create a release
      # candidate or claim the later Cloudflare deployment succeeded.
      #
      # Missing DeepL skips translation. A configured provider runs in
      # best-effort mode: a provider failure finishes the ledgered run as
      # degraded after baking the still-usable Arabic snapshot.
      #
      # --pipeline-mode is hardcoded to scheduled, unconditionally, on every
      # trigger of this workflow (cron and manual dispatch alike): the
      # dispatch form's pipeline_mode input only ever offers "scheduled" (see
      # its `options:` above), so there is no input value that could change
      # this. This workflow ends in an unconditional public Cloudflare
      # deploy below -- it must never run a larger, unreviewed backfill scrape
      # and then publish it (see docs/adr/0032; use backfill.yml for a real
      # backfill, which has no deploy step to guard). limit_per_source is
      # still an explicit override for a one-off larger *scheduled* run, and
      # is read from inputs via an env var (never interpolated directly into
      # the shell) only on a manual dispatch; the cron `schedule` trigger has
      # no `inputs` context at all, so a cron run always passes no override.
      - name: Run ledgered core pipeline
        env:
          REVIEW_MARGIN: ${{ inputs.review_margin || '0.15' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT_PER_SOURCE: ${{ inputs.limit_per_source }}
        run: |
          translation_mode=skip
          if [ -n "${DEEPL_API_KEY:-}" ]; then
            translation_mode=best-effort
          fi

          limit_args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_LIMIT_PER_SOURCE:-}" ]; then
            limit_args=(--limit-per-source "$INPUT_LIMIT_PER_SOURCE")
          fi

          python main.py run-core-pipeline \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --translation-mode "$translation_mode" \
            --review-margin "$REVIEW_MARGIN" \
            --pipeline-mode scheduled \
            "${limit_args[@]}" \
            --out dist/data.json

      - run: cp src/api/static/dashboard.html dist/index.html
      - run: cp src/api/static/country.html dist/country.html

      # Deploys as a Workers-with-static-assets site (wrangler.toml), not
      # classic Pages -- see docs/adr/0008 for why.
      - name: Deploy dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Pinned explicitly: wrangler-action's default (3.90.0) predates
          # run_worker_first in [assets], which wrangler.toml relies on.
          wranglerVersion: '4'
