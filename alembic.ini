[alembic]
# Keep migrations at the repository root. ``%(here)s`` makes this work even
# when Alembic is invoked from another directory.
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Deliberately empty. Operators must set DATABASE_URL explicitly. Tests and
# release tooling can instead pass a URL or connection programmatically.
sqlalchemy.url =
