# known names the gazetteer extractor looks for.
#
# object types have to match config/ontology.yaml or record_document_fact
# rejects them. keys are the canonical arabic spelling and the list under
# each one is alternate spellings people actually write.
#
# i do not list hamza and diacritic variants here. the adapter normalizes
# both the gazetteer and the document before matching so أردوغان and
# اردوغان collapse to the same key on their own. only genuinely different
# wordings go in the alias lists.

person:
  دونالد ترامب: [ترامب, ترمب, دونالد ترمب]
  بنيامين نتنياهو: [نتنياهو]
  بشار الأسد: [الأسد]
  أحمد الشرع: [الشرع]
  رجب طيب أردوغان: [أردوغان]
  فلاديمير بوتين: [بوتين]
  فولوديمير زيلينسكي: [زيلينسكي]
  علي خامنئي: [خامنئي, المرشد الأعلى]
  مسعود بزشكيان: [بزشكيان]
  محمد باقر قاليباف: [قاليباف]
  عبد الفتاح السيسي: [السيسي]
  محمد بن سلمان: [بن سلمان, ولي العهد السعودي]
  إيمانويل ماكرون: [ماكرون]
  كير ستارمر: [ستارمر]
  أنطونيو غوتيريش: [غوتيريش]
  مسرور بارزاني: [بارزاني]

